plugins {
    id 'com.android.application'
}

// Release signing comes from local.properties (never committed); without it the release APK is unsigned.
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { localProps.load(it) }

android {
    namespace 'com.maydings.vibelauncher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.maydings.vibelauncher'
        minSdk 26
        targetSdk 34
        versionCode 54
        versionName '2.4.1'
    }

    buildFeatures {
        buildConfig true
    }

    // Two ways onto a TV, built from the same code:
    // adb: sideloaded (build-and-install.sh, or the GitHub releases). The stock launcher is turned off over
    //   adb, so Home comes here by itself. Updates itself from the releases and can install SmartTube.
    // store: for an app store. No adb, so the stock launcher stays on; HomeKeyService (src/store) brings the
    //   Home button here instead. Stores don't allow apps that install apps, so no self-update or SmartTube
    //   install, and none of their permissions (src/adb/AndroidManifest.xml).
    flavorDimensions = ['channel']
    productFlavors {
        adb {
            dimension 'channel'
            buildConfigField 'boolean', 'STORE', 'false'
        }
        store {
            dimension 'channel'
            buildConfigField 'boolean', 'STORE', 'true'
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata that AndroidX's dependencies bring in. This launcher is plain Java and never
            // reads it; leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    signingConfigs {
        release {
            if (localProps.releaseStoreFile) {
                storeFile file(localProps.releaseStoreFile)
                storePassword localProps.releaseStorePassword
                keyAlias localProps.releaseKeyAlias
                keyPassword localProps.releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // R8: drops the library code the launcher never calls (most of AndroidX and Kotlin's standard
            // library), and shortens names. Each build's mapping.txt turns a stack trace back into real names.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (localProps.releaseStoreFile) signingConfig signingConfigs.release
        }
        // With the release key at hand, debug builds use it too: a TV can then switch between a debug
        // build and the releases (and their in-app updates) without uninstalling and losing its settings.
        debug {
            if (localProps.releaseStoreFile) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.1.0'
    implementation 'com.google.zxing:core:3.5.4'   // QR code for pasting keys from a phone
    // The store build: whether Play has a newer version, and Play's own update screen (StoreUpdates).
    storeImplementation 'com.google.android.play:app-update:2.1.0'
}
